name: Deploy landing page to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare static site
        run: |
          mkdir _site
          cp landing-page-tiktok-shop-business-master.html _site/index.html
          cp landing-page-shopee-chuyen-sau.html _site/landing-page-shopee-chuyen-sau.html
          cp landing-page-shopee-chuyen-sau-v2.html _site/landing-page-shopee-chuyen-sau-v2.html
          mkdir -p _site/source/img
          cp -R source/img/tiktok-shop _site/source/img/tiktok-shop
          cp -R source/img/shopee-chuyen-sau _site/source/img/shopee-chuyen-sau

      - name: Upload landing page
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
